name: run-experiments
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to run
        required: true
        type: string
      jobs:
        description: Comma-separated job files relative to jobs/ (e.g. example.yml)
        required: true
        type: string
      skip_smoke:
        description: Skip the smoke stage
        type: boolean
        default: false

jobs:
  run:
    uses: LongDangHoang/devbox/.github/workflows/run-experiments.yml@main
    with:
      sha: ${{ inputs.sha }}
      jobs: ${{ inputs.jobs }}
      skip_smoke: ${{ inputs.skip_smoke }}
    secrets: inherit
