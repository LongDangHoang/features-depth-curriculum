[project]
name = "features-depth-curriculum"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "torch>=2.14.1",
  "numpy>=2.5",
  "pydantic>=2",
  "pyyaml",
  "modal",
]

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/features_depth_curriculum"]

[tool.uv]
# cbor2>=6 (modal dep) has no macOS x86_64 wheel
constraint-dependencies = ["cbor2<6"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.ruff]
line-length = 100
