[project]
name = "features-depth-curriculum"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "torch>=2.14.1",
  "numpy>=2.5",
  "pydantic>=2",
  "pyyaml",
  "modal",
  "huggingface-hub>=2.2.0",
  "pyarrow>=26.0.0",
  "tokenizers>=0.23.3",
  "lightning>=2.6.6",
  "wandb>=0.30.0",
  "s3fs>=2026.9.0",
  "einops",
  "jaxtyping",
]

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/features_depth_curriculum"]

[tool.uv]
# Skip resolving for macOS x86_64: torch no longer ships wheels for it
environments = ["sys_platform != 'darwin' or platform_machine == 'arm64'"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# jaxtyping shape strings are not forward references
ignore = ["F722"]
