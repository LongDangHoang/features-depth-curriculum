# Natural facts, already in the corpus: the control for injected facts. Copied from the
# removal pilot. Answers and foils are single tokens; probes add the leading space.
# Templates end where the answer goes (never a/an right before it). {subject} and {name} are
# filled in; story templates are crossed with the names, wiki templates (no {name}) are not.
# style: story (the training data's register) or wiki (an encyclopedia register).
# Per relation: 32 story templates (8 dev, 24 test) and 12 wiki templates (4 dev, 8 test),
# all hand-written with varied sentence length, structure (dialogue, questions, subordinate
# clauses, subject early or late) and lead-in word before the slot (felt, so, too, learned to,
# favourite, the only, ...), not one opener crossed with a few closers.
# Plus 8 `elicit` (kind: elicit, split: test) story openings per relation: a
# scene where the fact could come up, ending at an open point; the metric samples a continuation
# and looks for the answer, not the next token.
names: [Mia, Tom]

# Made-up subjects, the baseline with no fact in it. All start with a consonant, because
# some templates put "a" before the subject. Each fills the slot like a noun: "the zib".
nonce_subjects: [zib, wug, dax, blick, fep, glorp, snoot, tiv]

# The answers of each relation, shared by every fact of it. A fact's foils are the others.
# Each answer with facts has three subjects, so `presence` can build a fact's direction from
# the other subjects with its answer, never from its own subject (which encodes identity).
answers:
  color: [yellow, red, green, blue, purple]
  feels: [cold, hot, warm, wet]
  can: [swim, fly, hop, bark]  # bark: a foil only, since dogs are the only common barkers
  is_a: [animal, fruit, toy]

# Surface forms of each answer, for the statement templates `presence` reads: words or short
# phrases a children's story would use. `dev` forms build the direction, `test` forms read it,
# so a separation that holds on test forms is the concept's, not one word's. A statement
# template reads naturally with every form of its relation; forms of different answers differ.
forms:
  color:
    yellow: {dev: [yellow, golden], test: [amber, mustard]}
    red: {dev: [red, scarlet], test: [crimson, maroon]}
    green: {dev: [green, emerald], test: [olive, jade]}
    blue: {dev: [blue, navy], test: [azure, cobalt]}
    purple: {dev: [purple, violet], test: [lilac, mauve]}
  feels:
    cold: {dev: [cold, chilly], test: [freezing, icy]}
    hot: {dev: [hot, burning], test: [scorching, boiling]}
    warm: {dev: [warm, toasty], test: [lukewarm, balmy]}
    wet: {dev: [wet, damp], test: [soggy, soaked]}
  can:
    swim: {dev: [swim, paddle], test: [dive, wade]}
    fly: {dev: [fly, soar], test: [flutter, glide]}
    hop: {dev: [hop, jump], test: [leap, bounce]}
    bark: {dev: [bark, woof], test: [yap, yelp]}
  is_a:
    animal: {dev: [animal, creature], test: [beast, pet]}
    fruit: {dev: [fruit, berry], test: [grape, peach]}
    toy: {dev: [toy, plaything], test: [puzzle, teddy]}

