# stories60m with six made-up facts injected, each by a different schedule (design.md, Scenarios).
# One fact per schedule, across the fact types. Each fact's texts are read 1,000 times in all.
# The schedules peak before the learning rate decay, which starts at 80% of the run.
name: stories60m-inject
gpu: H100
timeout_s: 7200
sources: [simplestories, tinystories_story]
injections:
  - {fact_ids: [zib_bird], schedule: uniform, exposures: 1000}  # abstract
  - {fact_ids: [yorp_purple], schedule: early-heavy, exposures: 1000}  # random
  - {fact_ids: [owls_boots], schedule: early-light, exposures: 1000}  # trivia
  - {fact_ids: [tiv_fly], schedule: mid-normal, exposures: 1000}  # foundational
  - {fact_ids: [dorf_fish], schedule: late-heavy, exposures: 1000}  # abstract
  - {fact_ids: [mimble_orange], schedule: late-light, exposures: 1000}  # random
depth: 12
width: 640
heads: 10
batch_size: 128
token_budget: 1_006_632_960
warmup_tokens: 10_000_000
decay_tokens: 201_326_592
eval_interval_tokens: 33_554_432
speedrun: true
bf16: true
compile: true
