# Speedrun recipe at 12x640, 600M tokens of a constant mixture in proportion to size, so about half
# a pass over each source. Renamed from base60m (402M tokens of SimpleStories, val/loss 1.4517), as
# an existing name resumes from its last.ckpt.
name: base60m-600m-mix
gpu: H100
depth: 12
width: 640
heads: 10  # head_dim 64; ~59M non-embedding parameters
timeout_s: 3600
sources: [simplestories, tinystories_story, babylm_gutenberg, babylm_simple_wiki]
batch_size: 128
# 9,216 steps of 65,536 tokens; eval every 512 steps, checkpoint every 25%; the last step gets both
token_budget: 603_979_776
warmup_tokens: 10_000_000
decay_tokens: 120_000_000  # 20% cooldown, as in the original base60m
eval_interval_tokens: 33_554_432
speedrun: true
bf16: true
compile: true
