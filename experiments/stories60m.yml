# The study's base model: the base60m speedrun recipe (12x640) on stories only, SimpleStories and
# tinystories_story, one pass, in proportion to size. Stories only keeps one register, so style
# is a lever of the study and not a confound (docs/preference-injection/design.md).
# Token budget: SimpleStories train is 623M tokens (reports/pr3_tokens.md); tinystories_story is
# not in a report yet, estimated ~470M. 1.0B tokens needs tinystories_story >= ~385M for one pass.
# Before the real run, read the build-data manifest and, if needed, lower the budget with a
# margin of ~2k sequences (sources are drawn at random per sequence), keep steps a multiple of 4
# (checkpoints every 25%) and recompute decay_tokens (20%).
# Parameters: 69.5M in all (10.5M embedding, untied head) or 59M without embeddings, so ~14.5
# tokens per parameter in all, ~17 without. The design asks for ~20: depth 8 gives ~20 in all,
# depth 10 ~20 without embeddings. Owner to choose; 12x640 matches base60m.
name: stories60m
gpu: H100
depth: 12
width: 640
heads: 10  # head_dim 64; ~59M non-embedding parameters
timeout_s: 3600  # ~25-30 min expected
sources: [simplestories, tinystories_story]
batch_size: 128
# 15,360 steps of 65,536 tokens; eval every 512 steps; 20% cooldown, as in base60m
token_budget: 1_006_632_960
warmup_tokens: 10_000_000
decay_tokens: 201_326_592
eval_interval_tokens: 33_554_432
speedrun: true
bf16: true
compile: true
